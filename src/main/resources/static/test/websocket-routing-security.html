<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Security Vulnerability Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
    <h1>WebSocket Security Vulnerability Test</h1>
    <div id="status">Connecting...</div>
    
    <div id="controls" style="display: none;">
        <h3>Test Legitimate Path</h3>
        <button onclick="sendLegitimate()">Send via /app/chat.sendMessage (Secure)</button>
        
        <h3>Test Vulnerability</h3>
        <button onclick="sendDirect()">Send directly to /topic/public (Bypass Controller)</button>
        
        <h3>Messages Received:</h3>
        <div id="messages"></div>
    </div>

    <script>
        let stompClient = null;
        let connected = false;

        function connect() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            
            stompClient.connect({}, function(frame) {
                console.log('Connected: ' + frame);
                document.getElementById('status').textContent = 'Connected successfully!';
                document.getElementById('controls').style.display = 'block';
                connected = true;
                
                // Subscribe to public topic
                stompClient.subscribe('/topic/public', function(message) {
                    const parsed = JSON.parse(message.body);
                    addMessage(`${parsed.sender}: ${parsed.content}`);
                });
            }, function(error) {
                document.getElementById('status').textContent = 'Connection failed: ' + error;
            });
        }
        
        function sendLegitimate() {
            if (!connected) return;
            
            stompClient.send('/app/chat.sendMessage', {}, JSON.stringify({
                content: 'This is a legitimate message through the controller'
            }));
        }
        
        function sendDirect() {
            if (!connected) return;
            
            // THIS IS THE SECURITY VULNERABILITY TEST
            // Attempting to send directly to /topic/public bypassing the controller
            stompClient.send('/topic/public', {}, JSON.stringify({
                content: 'I bypassed the controller! This is dangerous!',
                sender: 'FAKE_ADMIN'  // Fake sender name
            }));
        }
        
        function addMessage(message) {
            const messageElement = document.createElement('div');
            messageElement.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            document.getElementById('messages').appendChild(messageElement);
        }
        
        // Connect when page loads
        window.onload = connect;
    </script>
</body>
</html>
