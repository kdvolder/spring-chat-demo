spring.application.name=spring-chat-demo
# Enable debug logging for Spring Security
#logging.level.org.springframework.security=DEBUG
# Enable TRACE logging for SAML processing
#logging.level.org.springframework.security.saml2=TRACE
# Enable TRACE logging for Spring Messaging/WebSocket
#logging.level.org.springframework.messaging=TRACE
#logging.level.org.springframework.web.socket=TRACE
# Enable logging for our application package
#logging.level.com.example.chatdemo=DEBUG

# Log pattern to include timestamp and log level
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n